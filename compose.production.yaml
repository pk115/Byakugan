services:
  supapulse:
    build: .
    image: byakugan:2.2.0
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    environment:
      SUPAPULSE_HOST: 0.0.0.0
      SUPAPULSE_PORT: 3000
      SUPAPULSE_DATA_DIR: /app/data
      SUPAPULSE_MASTER_KEY: ${SUPAPULSE_MASTER_KEY:?Set SUPAPULSE_MASTER_KEY}
      SUPAPULSE_SESSION_SECRET: ${SUPAPULSE_SESSION_SECRET:?Set SUPAPULSE_SESSION_SECRET}
      SUPAPULSE_SECURE_COOKIES: "true"
      SUPAPULSE_PUBLIC_ORIGIN: ${SUPAPULSE_PUBLIC_ORIGIN:?Set the public HTTPS origin}
    volumes:
      - supapulse-data:/app/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      SUPAPULSE_DOMAIN: ${SUPAPULSE_DOMAIN:?Set the public domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      supapulse:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  supapulse-data:
  caddy-data:
  caddy-config:
