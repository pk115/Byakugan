services:
  supapulse:
    build: .
    image: byakugan:local
    container_name: byakugan
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      SUPAPULSE_HOST: 0.0.0.0
      SUPAPULSE_PORT: 3000
      SUPAPULSE_DATA_DIR: /app/data
      SUPAPULSE_MASTER_KEY: ${SUPAPULSE_MASTER_KEY:?Set SUPAPULSE_MASTER_KEY in .env}
      SUPAPULSE_SESSION_SECRET: ${SUPAPULSE_SESSION_SECRET:?Set SUPAPULSE_SESSION_SECRET in .env}
      SUPAPULSE_SECURE_COOKIES: ${SUPAPULSE_SECURE_COOKIES:-false}
      SUPAPULSE_PUBLIC_ORIGIN: ${SUPAPULSE_PUBLIC_ORIGIN:-}
      # 1 when only a reverse proxy (e.g. Cloudflare Tunnel) can reach the published port; keep the port bound to 127.0.0.1.
      SUPAPULSE_TRUST_PROXY_HOPS: ${SUPAPULSE_TRUST_PROXY_HOPS:-0}
    volumes:
      - supapulse-data:/app/data
      # The Docker monitor type needs /var/run/docker.sock mounted here, and that hands the container control of the host's Docker.
      # It is intentionally not mounted; see compose.production.yaml for the hardened layout.
    tmpfs:
      - /tmp:size=128m,mode=1777

volumes:
  supapulse-data:
