services:
  postgres-migration-target:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPAPULSE_POSTGRES_DB:-supapulse}
      POSTGRES_USER: ${SUPAPULSE_POSTGRES_USER:-supapulse}
      POSTGRES_PASSWORD: ${SUPAPULSE_POSTGRES_PASSWORD:?Set SUPAPULSE_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SUPAPULSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - supapulse-postgres-migration:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  supapulse-postgres-migration:
